name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repository layout
        run: python scripts/validate_repository.py

      - name: Run trellis-commit-zh lifecycle tests
        working-directory: skills/trellis-commit-zh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify skills CLI discovery
        run: npx --yes skills add . --list
